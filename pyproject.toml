[project]
name = "entangle-rsa"
version = "0.1.0"
description = "What does entanglement buy a quantum RL policy? RSA of PQC vs MLP policy representations."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "pennylane>=0.38",
  "gymnasium>=1.0",
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "pyyaml",
  "tabulate",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["entangle_rsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running training tests"]
addopts = "-m 'not slow'"
